<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 300px; margin: 0; padding: 14px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1c1e21; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
  .stat { background: #f0f2f5; border-radius: 8px; padding: 6px 8px; }
  .stat b { display: block; font-size: 18px; }
  label { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  button { width: 100%; margin-top: 6px; padding: 8px; border: 0; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer; background: #e4e6eb; }
  button.primary { background: #0866ff; color: #fff; }
  button.danger { background: none; color: #a1261b; font-weight: 500; }
  .note { color: #65676b; font-size: 12px; margin-top: 8px; }
  .warn { color: #a1261b; }
  a { color: #0866ff; }
</style>
</head>
<body>
  <h1>Ad Library Saver</h1>
  <div class="stats">
    <div class="stat"><b id="total">–</b>ads saved</div>
    <div class="stat"><b id="advertisers">–</b>advertisers</div>
    <div class="stat"><b id="tagged">–</b>tagged by Jev</div>
    <div class="stat"><b id="pending">–</b>untagged / failed</div>
  </div>
  <label><input type="checkbox" id="autoSave"> Save ads as I scroll</label>
  <label><input type="checkbox" id="autoTag"> Tag new ads with Jev</label>
  <button class="primary" id="export">Export CSV</button>
  <button id="tagPending">Tag untagged and failed</button>
  <button id="retagAll">Retag all</button>
  <button class="danger" id="clear">Clear database…</button>
  <div class="note" id="note"></div>
  <div class="note"><a href="#" id="options">Jev key and settings</a></div>
  <script src="popup.js" type="module"></script>
</body>
</html>
